name: build-bc2
on: workflow_dispatch
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile
          platforms: linux/amd64
          provenance: false          # keep the manifest simple for old Singularity
          push: true
          #tags: ghcr.io/${{ github.repository_owner }}/bindcraft:1.0
          tags: ghcr.io/${{ github.repository_owner }}/bindcraft:cuda12
